name: Backup Supabase Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habblo-supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create read-only PostgreSQL backup
    runs-on: ubuntu-24.04
    environment: supabase-production
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "20"

    steps:
      - name: Validate explicit production connection target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ.get("DATABASE_URL", "")
          if not raw:
              raise SystemExit("SUPABASE_DB_URL is empty or unavailable")
          parsed = urlsplit(raw)
          expected = {
              "scheme": "postgresql",
              "hostname": "aws-1-sa-east-1.pooler.supabase.com",
              "username": "postgres.cslemmvlcfaxupmiswqd",
              "port": 5432,
              "path": "/postgres",
          }
          actual = {
              "scheme": parsed.scheme,
              "hostname": parsed.hostname,
              "username": parsed.username,
              "port": parsed.port,
              "path": parsed.path,
          }
          if actual != expected:
              raise SystemExit("SUPABASE_DB_URL does not match the approved production Session Pooler target")
          print("Connection target matches the approved Habblover production project.")
          PY

      - name: Prepare safely decoded libpq connection parameters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit

          raw = os.environ.get("DATABASE_URL", "")
          parsed = urlsplit(raw)
          values = {
              "PGHOST": parsed.hostname or "",
              "PGPORT": str(parsed.port or ""),
              "PGDATABASE": (parsed.path or "").lstrip("/"),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
          }
          if not all(values.values()):
              raise SystemExit("Database URI is missing a required connection component")
          if any("\n" in value or "\r" in value or "\x00" in value for value in values.values()):
              raise SystemExit("Database connection parameters contain unsupported control characters")
          password = values["PGPASSWORD"]
          mask_value = password.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::add-mask::{mask_value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          print("Decoded connection parameters prepared; password remains masked.")
          PY

      - name: Validate database authentication
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE \
            --env PGUSER \
            --env PGPASSWORD \
            --env PGSSLMODE \
            --env PGCONNECT_TIMEOUT \
            postgres:17-alpine \
            sh -ceu 'psql -X -v ON_ERROR_STOP=1 -Atc "SELECT current_database(), current_user;"'

      - name: Create and verify custom-format dump
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/habblover-backup"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"

          docker run --rm \
            --env PGHOST \
            --env PGPORT \
            --env PGDATABASE \
            --env PGUSER \
            --env PGPASSWORD \
            --env PGSSLMODE \
            --env PGCONNECT_TIMEOUT \
            --volume "$backup_dir:/backup" \
            postgres:17-alpine \
            sh -ceu '
              pg_dump --format=custom --no-owner --no-acl --file=/backup/habblover-supabase.dump
              test -s /backup/habblover-supabase.dump
              pg_restore --list /backup/habblover-supabase.dump > /backup/archive-contents.txt
              test -s /backup/archive-contents.txt
            '

          (
            cd "$backup_dir"
            sha256sum habblover-supabase.dump > SHA256SUMS.txt
            stat --printf='Backup size: %s bytes\n' habblover-supabase.dump
            cat SHA256SUMS.txt
          )

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: habblo-supabase-backup
          path: |
            ${{ runner.temp }}/habblover-backup/habblover-supabase.dump
            ${{ runner.temp }}/habblover-backup/archive-contents.txt
            ${{ runner.temp }}/habblover-backup/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
